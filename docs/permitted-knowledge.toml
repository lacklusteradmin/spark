# What each server is allowed to persist. Deny by default.
#
# This is the machine-readable form of Spark-build-notes.md §2. Each server crate
# ships a `schema.toml` declaring every field it writes to durable storage; the
# test in crates/spark-invariants/tests/permitted_knowledge.rs asserts that
# declaration is a subset of this file. A field that is not listed here cannot be
# persisted, whatever it is called.
#
# Two nets, because a whitelist alone fails the day someone renames a field to
# something already on it:
#   1. subset check   — every declared field appears below
#   2. concept ban    — no declared field, whitelisted or not, matches a banned
#                       substring. Catches `owner_addr` slipping in as `addr`.

[keyring_service]
# Trust domain 1. The only service that knows an account-shaped identifier exists.
fields = [
  "minute", "count", # service-wide replay window high-water mark and admission counter
  "auth_nonce", # one-use request proof, retained only for its valid time window
  "addr",              # SHA-256 derived keyring address. NOT a public key.
  "snapshot_bytes",    # opaque kind-3 chunk
  "snapshot_len",
  "delta_bytes",
  "delta_index",
  "mtime",
  "withdrawal_response", # blind responses for exact account-bound request retries
  "quota_media_used",
  "quota_text_used",
  "quota_limit",
  "rate_window_start",
  "rate_count",
  "spent_refund_voucher",
  "refund_account", # binds redemption retry to the same account; no receipt link
  # The contact-request tray. The service sees the *recipient* at write time,
  # which is unavoidable — a request has to be delivered somewhere — and is
  # listed as open question §9.5 in docs/protocol.md. It never sees the sender:
  # the write carries an opaque inbox permit; identities remain inside the signed AEAD.
  "request_index",
  "request_bytes",
  "inbox_permits",     # bounded opaque authorization hashes, no identities; reveals permit count and repeat use
]

[content_service]
# Trust domain 2. No accounts. Reads carry nothing at all.
fields = [
  "chunk_name",
  "chunk_bytes",
  "chunk_len",
  "chunk_kind",
  "receipt_count",     # how many unknown parties hold it. Not who.
  "receipt_hash",
  "refund_request_hash", # binds exact retry to one receipt
  "refund_response", # blinded response only, never the redeemed voucher
  "receipt_size_class", # denomination already visible at upload; binds the refund
  "spent_token_serial",
  "upload_request_hash",
  "upload_receipt", # exact replay returns the same capability, never increments holders
]

[issuer_service]
# Trust domain 3. Blind. The mapping is overwritten on transfer, never appended.
fields = [
  "name",
  "name_pubkey",
  "paid_until_day",
  "blind_sig_count",
  "spent_voucher_serial",
  # Prevents one payment minting unlimited vouchers. It is a reference to a
  # transaction on a public chain, stored with nothing joined to it — no key, no
  # voucher serial, no name. The ban list below targets fields that *link* a
  # payment to a key; this one cannot, because at signing time the issuer has only
  # a blinded message and could not record the link if it wanted to.
  #
  # F9 already accepts what this reveals: "A transparent chain lets an observer tie
  # a KYC'd withdrawal to a payment, revealing that someone bought a voucher; the
  # voucher still hides which account redeemed it."
  "spent_payment_ref",
  "payment_request_hash", # retry binding; not the hidden claim
  "payment_response", # blinded signature, no redemption link
  "name_tier",
  "transfer_nonce", # current challenge only, rotated on transfer/registration
]

# Concepts that must never be stored, in any service, phrased as the words a
# schema would actually use (build-notes §2).
#
# Matching is on `_`-separated tokens, not raw substrings. A field is banned when
# a banned entry's tokens appear as a contiguous run in the field's tokens:
#   "ip"        bans  client_ip, ip_addr      but not  receipt_count
#   "real_name" bans  real_name, user_real_name  but not  chunk_name
# Raw substring matching would need an allow list, and every entry on an allow
# list is a hole in this net. Token matching needs none.
[banned]
substrings = [
  "sender", "recipient", "from_addr", "to_addr", "peer",
  "room", "member", "membership", "group_id", "participant",
  "uploader", "uploaded_by", "owner_addr", "author",
  "contact", "friend", "roster", "graph", "edge",
  "ip", "user_agent", "device_id", "push_token", "apns", "fcm",
  "phone", "email", "real_name",
  "payment_addr", "tx_hash", "invoice_key", "payer",
  "transfer_history", "previous_pubkey", "old_key",
  "plaintext", "message_body", "content_text",
]
