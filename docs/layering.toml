# The crate graph, declared once so it can be enforced instead of remembered.
# crates/spark-invariants/tests/layering.rs checks every rule below against the
# real Cargo.toml files. Editing this file is how you change the architecture;
# editing a Cargo.toml without editing this file is a test failure.
#
# zone
#   pure      below the I/O line. No network, no filesystem, no clock.
#             Everything here runs in gate 2-4 with no server in existence.
#   io        above the I/O line, below the FFI line. May do I/O.
#   boundary  the FFI line and above. Must contain no cryptography.
#
# layer
#   A crate may depend only on workspace crates with a strictly lower layer.
#   This is what makes the graph a DAG without needing a cycle check.

[[crate]]
name  = "spark-crypto"
layer = 0
zone  = "pure"
deps  = []
role  = "HKDF, XChaCha20-Poly1305, SHA-256, Ed25519, BIP-39, blind-signature client. Pure functions."

[[crate]]
name  = "spark-identity"
layer = 1
zone  = "pure"
deps  = ["spark-crypto"]
role  = "seed -> keypair, derivation path, local key storage, key migration"

[[crate]]
name  = "spark-chunk"
layer = 1
zone  = "pure"
deps  = ["spark-crypto"]
role  = "chunk format, AEAD sealing, lanes, and the two naming schemes: SHA-256(chunk) for media so the store can verify it, HMAC under the room root for history so an outsider cannot guess it"

[[crate]]
name  = "spark-mls"
layer = 2
zone  = "pure"
deps  = ["spark-crypto", "spark-identity"]
role  = "the policy on top of MLS: flat owner set in a group context extension, and who may add, remove, appoint, dismiss, leave, dissolve. No cryptography. The provider — entropy, crypto backend, storage — arrives as a parameter"

[[crate]]
name  = "spark-keyring"
layer = 2
zone  = "pure"
deps  = ["spark-crypto", "spark-identity", "spark-chunk"]
role  = "the outer envelope layer: room roots, receipts, upload list, tokens, names. Snapshot plus append-only deltas, sealed under the seed-derived keyring key"

[[crate]]
name  = "spark-sync"
layer = 3
zone  = "pure"
# Deliberately not spark-mls. Ordering and addressing do not need to understand
# what a payload is; interpreting one needs a provider, which is the client's job.
# Keeping payloads opaque here is what lets the total order be a pure function.
deps  = ["spark-crypto", "spark-chunk", "spark-keyring"]
role  = "lane merge, vector clocks, the total order every client must agree on, and the outbox that enforces reserve-before-seal"

# ---- I/O line ----
# Everything above this point is `pure`. spark-transport is the only crate below
# spark-client that is allowed to touch the network.

[[crate]]
name  = "spark-transport"
layer = 4
zone  = "io"
deps  = ["spark-chunk"]
role  = "the only crate below spark-client allowed to touch the network. Traffic-class routing (D2), SOCKS5 with per-circuit stream isolation, and a ledger of every connection opened — which is how gate 9 is checkable at all. WebSocket framing and TLS land with the client stage; Hysteria attaches at Transport::open."

[[crate]]
name  = "spark-tokens"
layer = 3
zone  = "pure"
deps  = ["spark-crypto", "spark-keyring"]
role  = "blind-token withdrawal/spend protocol, refund vouchers, quota ledger. Takes a transport from the caller rather than owning one, so the security-critical half is testable offline."

[[crate]]
name  = "spark-client"
layer = 5
zone  = "io"
deps  = ["spark-crypto", "spark-identity", "spark-chunk", "spark-mls", "spark-keyring", "spark-sync", "spark-transport", "spark-tokens"]
role  = "facade, state machine, event stream. The whole API surface."

# ---- FFI line ----

[[crate]]
name  = "spark-ffi"
layer = 6
zone  = "boundary"
deps  = ["spark-client"]
role  = "UniFFI bindings. No logic."

[[crate]]
name  = "spark-cli"
layer = 6
zone  = "boundary"
deps  = ["spark-client"]
role  = "scripted verification harness. Not a user-facing product."

# ---- servers: separate graph, never depended on by client crates ----

[[crate]]
name  = "spark-store"
layer = 9
zone  = "io"
deps  = []
role  = "storage that describes its own shape. Every write records its field names, so Db::inventory reports what a server actually stored rather than what someone wrote down. This is what makes gate 5 checkable against the code instead of against a hand-written schema."

[[crate]]
name  = "spark-keyring-server"
layer = 10
zone  = "io"
deps  = ["spark-crypto", "spark-chunk", "spark-store"]
role  = "trust domain 1: addr blobs, quota counters, token withdrawal. The only service that knows an account-shaped identifier exists"

[[crate]]
name  = "spark-content-server"
layer = 10
zone  = "io"
# spark-crypto for verifying blind tokens, and for the rule tests' Secret.
deps  = ["spark-crypto", "spark-chunk", "spark-store"]
role  = "trust domain 2: account-free chunk store, write-once, receipts. Writes carry a blind token; reads carry nothing at all"

[[crate]]
name  = "spark-issuer"
layer = 10
zone  = "io"
deps  = ["spark-crypto", "spark-store"]
role  = "trust domain 3: name mapping (overwritten on transfer, never appended), blind signing, payment nodes"

# Crates in `pure` must not reach these, directly or transitively.
[io_crates]
banned_in_pure = [
  "tokio", "async-std", "smol", "mio", "reqwest", "hyper", "ureq", "curl",
  "tungstenite", "tokio-tungstenite", "socket2", "rustls", "native-tls",
  "openssl", "tokio-socks", "axum", "actix-web", "warp", "rusqlite", "sled",
  # Entropy is a parameter everywhere below the I/O line: Mnemonic::from_entropy
  # takes it, Chunk::seal takes a nonce, and spark-mls takes an OpenMlsProvider.
  # `openmls_rust_crypto` stays a dev-dependency of spark-mls and a real one only
  # in spark-client.
  #
  # `getrandom` and `rand_core` were on this list and have been removed, which is
  # a deliberate trade rather than a relaxation. RFC 9474 blind signatures pull
  # getrandom transitively through prime generation, so banning the crate would
  # have forced the blind-signature *client math* — pure, and exactly the kind of
  # thing that must be offline-testable — above the I/O line to satisfy a rule
  # aimed at something else. What the rule is actually for is entropy being drawn
  # rather than passed, and that is a property of the source, not the manifest. It
  # now lives in `pure_source.banned_paths` below, where it catches the mistake
  # itself instead of a crate that makes the mistake possible.
  "rand", "openmls_rust_crypto", "openmls_memory_storage",
]

# Source-level bans inside `pure` crates. Cargo.toml alone cannot catch these:
# std is always available.
[pure_source]
banned_paths = [
  "std::net", "std::fs", "std::time::SystemTime", "std::time::Instant", "std::process",
  # Entropy must arrive as a parameter, never be drawn. These are the ways a pure
  # crate would draw it, and naming them is what the removal of `getrandom` from
  # banned_in_pure above is traded against.
  "OsRng", "thread_rng", "rand::random", "from_entropy()", "getrandom::",
]

# Crates in `boundary` must not touch cryptography. If a key is handled above the
# FFI line, reproducible builds stop bounding what an auditor has to read.
[boundary]
banned_crates = [
  "spark-crypto", "spark-identity", "spark-chunk", "spark-mls", "spark-keyring",
  "openmls", "ed25519-dalek", "x25519-dalek", "chacha20poly1305", "aes-gcm",
  "hkdf", "sha2", "bip39", "rsa",
]
