# cargo-deny configuration. The third net, alongside docs/layering.toml and
# docs/permitted-knowledge.toml.
#
# Layering catches shape. Permitted-knowledge catches what servers store. This
# catches what enters the dependency graph at all — the place where "no features
# outside chat" stops being a policy and becomes a build failure.

# Cryptography is OpenMLS plus the audited primitives named in docs/protocol.md.
# A second AEAD or a hand-rolled implementation arriving transitively is exactly
# what build-notes §1 forbids; add it to `deny` below the moment one shows up.
[bans]
multiple-versions = "warn"
wildcards = "deny"
# `wildcards` exists to catch `foo = "*"` against a registry, where it means "give
# me whatever is newest". A path dependency inside this workspace has no version
# because there is nothing to resolve — it is the crate next door, built from the
# same commit. Denying those would flag every internal edge and teach us to
# ignore the rule.
allow-wildcard-paths = true

# D7 and F4 are architectural, so they are enforced here rather than remembered.
# An HTML fetcher or parser in the client is the first step toward link previews
# and then integrations; build-notes §4 says "in any form".
deny = [
  # HTML / markup parsing
  { name = "html5ever" }, { name = "scraper" }, { name = "select" },
  { name = "kuchiki" }, { name = "kuchikiki" }, { name = "markup5ever" },
  { name = "lol_html" }, { name = "tl" }, { name = "htmlescape" },
  # Link preview / metadata scraping
  { name = "webpage" }, { name = "opengraph" }, { name = "og-image" },
  # Embedded browsers and JS engines
  { name = "webkit2gtk" }, { name = "wry" }, { name = "deno_core" },
  { name = "rusty_v8" }, { name = "boa_engine" }, { name = "quick-js" },
  # Push SDKs. D3: disabling push must prevent registration, which is impossible
  # to guarantee if a vendor SDK is linked in at all.
  { name = "fcm" }, { name = "a2" },
  # Telemetry. Spark has no analytics path, and a transitive one would be worse
  # than a deliberate one.
  { name = "sentry" }, { name = "opentelemetry" }, { name = "datadog-statsd" },
]

# MPL-2.0 covers hpke-rs and its backends, which OpenMLS needs for HPKE and which
# there is no permissive alternative to. It is file-level copyleft: it obliges
# publishing modifications to those files, which Spark already does, being AGPL
# and open source. It does not reach the rest of the tree.
[licenses]
allow = [
  "AGPL-3.0-or-later", "AGPL-3.0", "Apache-2.0", "MIT", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Unicode-3.0", "CC0-1.0", "MPL-2.0",
]
confidence-threshold = 0.93

[advisories]
yanked = "deny"

# Ignored by ID, never by category: a new advisory on anything still fails here.
#
# One of these is a real vulnerability rather than a maintenance notice. It is
# recorded in README.md under "Blocking before launch" as well, because an entry
# in this file is not where a shipping decision should live.
ignore = [
  { id = "RUSTSEC-2023-0071", reason = """
THE MARVIN ATTACK. A real vulnerability, not a maintenance notice.

`rsa` is not constant-time, so an attacker who can time private-key operations
over the network may recover the key. Spark does that on two servers: the keyring
service blind-signs storage tokens, the issuer blind-signs name vouchers.

Base blinding IS applied on every signature (blind_sign_with_rng passes an RNG,
and rsa randomises the base when given one), which is why the CVSS attack
complexity is high. A mitigation, not a proof, and the advisory has no patched
version.

Mitigated in Spark rather than merely accepted: responses are emitted on a fixed
cadence (spark-crypto::pace) so measurable duration does not vary with input, and
the signing keys rotate (spark-crypto::KeySet) so a recovered key mints for a
bounded time. See README.md for why a different construction is not the answer.

Revisit when rsa ships a constant-time implementation; the pacing then becomes
defence in depth rather than the control.
""" },
  { id = "RUSTSEC-2026-0173", reason = """
proc-macro-error2 is unmaintained. Not a vulnerability — an unmaintained notice.

It is a build-time proc macro reached only through the dev-dependency graph:
openmls_rust_crypto -> hpke-rs -> libcrux-sha3 -> hax-lib-macros. It executes at
compile time in the test build and links into no shipped artifact. The advisory
itself says no safe upgrade is available, so the only alternatives are dropping
OpenMLS's crypto provider or pinning an older tree — both worse.

Revisit when openmls_rust_crypto next bumps its libcrux dependency; if it is
still here then, raise it upstream rather than extending this entry.
""" },
]
