# Declared by spark-content-server. Note the absence of any column that could
# name a writer: writes are authorised by blind token and nothing else.
service = "content_service"
[[table]]
name = "chunk"
fields = ["chunk_name", "chunk_bytes", "chunk_len", "chunk_kind", "receipt_count"]
[[table]]
name = "receipt"
fields = ["chunk_name", "receipt_hash"]
[[table]]
name = "token_spent"
fields = ["spent_token_serial"]
