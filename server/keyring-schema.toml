# Declared by spark-keyring-server. Checked against docs/permitted-knowledge.toml.
service = "keyring_service"
[[table]]
name = "keyring"
fields = ["addr", "snapshot_bytes", "snapshot_len", "mtime"]
[[table]]
name = "keyring_delta"
fields = ["addr", "delta_index", "delta_bytes", "mtime"]
[[table]]
name = "quota"
fields = ["addr", "quota_media_used", "quota_text_used", "quota_limit"]
[[table]]
name = "rate"
fields = ["addr", "rate_window_start", "rate_count"]
[[table]]
name = "request"
fields = ["addr", "request_index", "request_bytes", "mtime"]
[[table]]
name = "refund_spent"
fields = ["spent_refund_voucher", "refund_account"]

[[table]]
name = "inbox_gate"
fields = ["inbox_permits"]

[[table]]
name = "withdrawal"
fields = ["withdrawal_response"]

[[table]]
name = "auth_spent"
fields = ["auth_nonce"]

[[table]]
name = "auth_window"
fields = ["minute", "count"]
