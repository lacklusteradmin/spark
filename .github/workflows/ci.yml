name: ci

on: [push, pull_request]

jobs:
  invariants:
    # Runs from commit 1 (build-notes §2). Everything else in the pipeline is
    # allowed to be added later; this job is not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.94.1 --profile minimal -c rustfmt -c clippy
      - run: rustc --version
      - run: cargo test -p spark-invariants -- --nocapture
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  banned-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.94.1 --profile minimal
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses advisories

  reproducible:
    # Gate 1, second half. Two builds on one runner catch nondeterminism within a
    # machine; `cross-machine` below catches the rest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.94.1 --profile minimal
      - run: scripts/verify-reproducible.sh

  cross-machine:
    # Two different machines, one pinned environment.
    #
    # The previous version of this job compared ubuntu-latest against
    # ubuntu-22.04 and failed, correctly. Reproducibility says the same *inputs*
    # give the same output, and the environment is an input: two distro images
    # have different glibc, different system linkers, and different `cc`. Rust
    # links against all three, so the bytes differ for a reason that is not a bug.
    # The old job was asserting something reproducible builds never promised.
    #
    # Pinning a container fixes the real problem instead of lowering the bar. The
    # environment is now identical by construction, `replica` gives two distinct
    # runner VMs, and the image is the one a third party would use to check a
    # release for themselves — which is the entire point of D4.
    needs: reproducible
    strategy:
      matrix:
        replica: [a, b]
    runs-on: ubuntu-latest
    container: rust:1.94.1-slim-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build-repro.sh /tmp/out
      - run: |
          cd /tmp/out/release
          find . -maxdepth 2 -type f \( -perm -u+x -o -name '*.rlib' \) \
            ! -name '*.dylib' ! -name '*.so' ! -name '*.dll' \
            | LC_ALL=C sort | xargs sha256sum | tee "$GITHUB_WORKSPACE/manifest-${{ matrix.replica }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.replica }}
          path: manifest-${{ matrix.replica }}.txt

  compare-machines:
    # The job above only *produces* two manifests. Without this one, nothing ever
    # asserts they match, and the cross-machine gate passes while proving nothing.
    needs: cross-machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          merge-multiple: true
      - run: |
          set -eu
          for f in manifest-a.txt manifest-b.txt; do
            [ -s "$f" ] || { echo "FAIL: $f is missing or empty" >&2; exit 1; }
          done
          if diff -u manifest-a.txt manifest-b.txt; then
            echo "PASS: $(wc -l < manifest-a.txt) artifacts identical on two machines"
          else
            echo "FAIL: the same commit built differently on two machines" >&2
            exit 1
          fi
