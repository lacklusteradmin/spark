name: ci

on: [push, pull_request]

jobs:
  invariants:
    # Runs from commit 1 (build-notes §2). Everything else in the pipeline is
    # allowed to be added later; this job is not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.94.1 --profile minimal -c rustfmt -c clippy
      - run: cargo test -p spark-invariants -- --nocapture
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  banned-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.94.1 --profile minimal
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses advisories

  reproducible:
    # Gate 1, second half. Two builds on one runner catch nondeterminism within a
    # machine; `cross-machine` below catches the rest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.94.1 --profile minimal
      - run: scripts/verify-reproducible.sh

  cross-machine:
    # Same commit, different runner image. A build that is deterministic only on
    # one machine does not give a user any way to check the binary they were
    # shipped, which is the whole point of D4.
    needs: reproducible
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.94.1 --profile minimal
      - run: scripts/build-repro.sh "$PWD/out"
      - run: |
          cd out/release
          find . -maxdepth 1 -type f \( -perm -u+x -o -name '*.rlib' \) \
            | LC_ALL=C sort | xargs shasum -a 256 | tee "$GITHUB_WORKSPACE/manifest-${{ matrix.os }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.os }}
          path: manifest-${{ matrix.os }}.txt

  compare-machines:
    # The job above only *produces* two manifests. Without this one, nothing ever
    # asserts they match, and the cross-machine gate passes while proving nothing.
    needs: cross-machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          merge-multiple: true
      - run: |
          set -eu
          a=manifest-ubuntu-latest.txt
          b=manifest-ubuntu-22.04.txt
          if diff -u "$a" "$b"; then
            echo "PASS: identical artifacts across two runner images"
          else
            echo "FAIL: the same commit built differently on two machines" >&2
            exit 1
          fi
