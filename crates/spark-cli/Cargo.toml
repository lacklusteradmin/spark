[package]
name = "spark-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "spark"
path = "src/main.rs"

[dependencies]
spark-client.workspace = true
spark-crypto.workspace = true
spark-chunk.workspace = true
spark-store.workspace = true
spark-transport.workspace = true
spark-wire.workspace = true
serde = { version = "1", default-features = false }
spark-keyring-server = { path = "../../server/spark-keyring-server" }
spark-content-server = { path = "../../server/spark-content-server" }
spark-issuer = { path = "../../server/spark-issuer" }
getrandom = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
rcgen = "0.14"

[dev-dependencies]
spark-keyring.workspace = true
spark-identity.workspace = true
spark-transport.workspace = true
