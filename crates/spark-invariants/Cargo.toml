[package]
name = "spark-invariants"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# No dependencies, deliberately. The harness that polices the dependency graph
# must not be part of it: a compromised or merely careless dependency should not
# be able to influence whether the invariant tests pass.
[dependencies]

# Gate 5 drives the real services and audits what they actually stored. These are
# the only dependencies the harness has, and they are the subjects under test —
# not libraries it relies on to reach a verdict.
[dev-dependencies]
spark-crypto.workspace = true
spark-identity.workspace = true
spark-chunk.workspace = true
spark-keyring.workspace = true
spark-mls.workspace = true
spark-sync.workspace = true
spark-tokens.workspace = true
spark-store.workspace = true
spark-keyring-server = { path = "../../server/spark-keyring-server" }
spark-content-server = { path = "../../server/spark-content-server" }
spark-issuer = { path = "../../server/spark-issuer" }
openmls_rust_crypto = "0.6"
openmls_traits = "0.6"
