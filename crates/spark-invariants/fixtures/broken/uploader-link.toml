# The content store starts recording who uploaded, to make quota accounting easy.
# build-notes §1: "Never store an upload-to-key link."
service = "content_service"
[[table]]
name = "chunk"
fields = ["chunk_name", "chunk_bytes", "chunk_len", "chunk_kind", "receipt_count"]
[[table]]
name = "receipt"
fields = ["chunk_name", "receipt_hash", "uploader_addr"]
