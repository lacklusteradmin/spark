[package]
name = "spark-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib for Android, staticlib for iOS, lib so the workspace can test it as Rust.
# These are the artifacts a mobile build consumes; nothing else in the workspace
# produces one.
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
spark-net.workspace = true
uniffi = { version = "0.29", default-features = false }
thiserror = { version = "2", default-features = false }
